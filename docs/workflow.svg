<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SMS Forwarder message workflow</title>
  <desc id="desc">A minimal flowchart from an inbound SMS through validation, protected queueing, outbound delivery, and metadata-only retention. Unsafe states pause forwarding.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="none" stroke="#2C7377" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', sans-serif; }
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      .title { fill: #18232D; font-size: 24px; font-weight: 750; letter-spacing: -0.03em; }
      .body { fill: #536270; font-size: 15px; }
      .muted { fill: #74818D; font-size: 13px; }
      .card { fill: #FFFFFF; stroke: #D4DCE2; stroke-width: 1.5; }
      .connector { stroke: #2C7377; stroke-width: 1.7; stroke-linecap: round; }
      .branch { stroke: #A4B0B8; stroke-width: 1.4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#F7F9FA"/>

  <!-- Header -->
  <g class="sans">
    <text x="72" y="64" class="eyebrow" fill="#2C7377">SMS FORWARDER / WORKFLOW</text>
    <text x="1528" y="64" text-anchor="end" class="mono muted">PRIVATE SIDELOAD / ANDROID 12+</text>
    <path d="M72 90H1528" stroke="#D4DCE2"/>

    <text x="72" y="166" fill="#18232D" font-size="54" font-weight="800" letter-spacing="-0.055em">Forwarding, with guardrails.</text>
    <text x="72" y="204" class="body">A message moves forward only when identity, privilege, quota, and destination checks agree.</text>
    <text x="72" y="230" class="muted">Unsafe or ambiguous states pause. Terminal work keeps metadata, not message content.</text>
  </g>

  <!-- Main rail -->
  <g class="sans">
    <text x="72" y="290" class="eyebrow" fill="#74818D">FORWARDING RAIL</text>

    <!-- connectors behind cards -->
    <path d="M328 449H360" class="connector" marker-end="url(#arrow)"/>
    <path d="M632 449H664" class="connector" marker-end="url(#arrow)"/>
    <path d="M936 449H968" class="connector" marker-end="url(#arrow)"/>
    <path d="M1240 449H1272" class="connector" marker-end="url(#arrow)"/>

    <!-- 1 -->
    <rect x="72" y="326" width="256" height="246" rx="10" class="card"/>
    <circle cx="104" cy="362" r="16" fill="#2C7377"/>
    <text x="104" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">1</text>
    <text x="132" y="367" class="eyebrow" fill="#2C7377">ARRIVAL</text>
    <text x="96" y="425" class="title">Inbound SMS</text>
    <text x="96" y="458" class="body">Android delivers a PDU</text>
    <text x="96" y="481" class="body">bundle on the selected</text>
    <text x="96" y="504" class="body">source subscription.</text>
    <text x="96" y="548" class="mono muted">SMS_RECEIVED</text>

    <!-- 2 -->
    <rect x="376" y="326" width="256" height="246" rx="10" class="card"/>
    <circle cx="408" cy="362" r="16" fill="#2C7377"/>
    <text x="408" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">2</text>
    <text x="436" y="367" class="eyebrow" fill="#2C7377">GATES</text>
    <text x="400" y="425" class="title">Check gates</text>
    <text x="400" y="458" class="body">Permissions, sensitive-SMS</text>
    <text x="400" y="481" class="body">privilege, SIM identity,</text>
    <text x="400" y="504" class="body">loops, and quota.</text>
    <text x="400" y="548" class="mono muted">FAIL CLOSED</text>

    <!-- 3 -->
    <rect x="680" y="326" width="256" height="246" rx="10" class="card"/>
    <circle cx="712" cy="362" r="16" fill="#2C7377"/>
    <text x="712" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">3</text>
    <text x="740" y="367" class="eyebrow" fill="#2C7377">QUEUE</text>
    <text x="704" y="425" class="title">Protect + queue</text>
    <text x="704" y="458" class="body">Encrypt message data,</text>
    <text x="704" y="481" class="body">persist the job, and start</text>
    <text x="704" y="504" class="body">expedited background work.</text>
    <text x="704" y="548" class="mono muted">AES-GCM / ROOM</text>

    <!-- 4 -->
    <rect x="984" y="326" width="256" height="246" rx="10" class="card"/>
    <circle cx="1016" cy="362" r="16" fill="#2C7377"/>
    <text x="1016" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">4</text>
    <text x="1044" y="367" class="eyebrow" fill="#2C7377">SUBMIT</text>
    <text x="1008" y="425" class="title">Outbound SMS</text>
    <text x="1008" y="458" class="body">Split the payload and send</text>
    <text x="1008" y="481" class="body">on the chosen outbound</text>
    <text x="1008" y="504" class="body">subscription, never default.</text>
    <text x="1008" y="548" class="mono muted">NO DEFAULT SIM</text>

    <!-- 5 -->
    <rect x="1288" y="326" width="240" height="246" rx="10" class="card"/>
    <circle cx="1320" cy="362" r="16" fill="#2C7377"/>
    <text x="1320" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">5</text>
    <text x="1348" y="367" class="eyebrow" fill="#2C7377">OUTCOME</text>
    <text x="1312" y="425" class="title">Record state</text>
    <text x="1312" y="458" class="body">Callbacks decide SENT,</text>
    <text x="1312" y="481" class="body">retry, partial, or unknown.</text>
    <text x="1312" y="548" class="mono muted">METADATA ONLY</text>
  </g>

  <!-- Branches -->
  <g class="sans">
    <path d="M504 572V638H272V690" class="branch" marker-end="url(#arrow)"/>
    <path d="M1408 572V638H800V690" class="branch" marker-end="url(#arrow)"/>
    <path d="M1408 572V638H1320V690" class="branch" marker-end="url(#arrow)"/>

    <rect x="72" y="690" width="400" height="142" rx="10" class="card"/>
    <text x="100" y="728" class="eyebrow" fill="#9A6A28">UNSAFE BRANCH</text>
    <text x="100" y="766" class="title">Pause, don’t guess.</text>
    <text x="100" y="796" class="body">Missing privilege or changed SIM identity</text>
    <text x="100" y="818" class="body">requires authenticated re-selection.</text>

    <rect x="600" y="690" width="520" height="142" rx="10" class="card"/>
    <text x="628" y="728" class="eyebrow" fill="#2C7377">DELIVERY OUTCOMES</text>
    <text x="628" y="766" class="title">SENT  /  RETRY_WAIT  /  UNKNOWN</text>
    <text x="628" y="796" class="body">Retry only when every segment is clearly transient.</text>
    <text x="628" y="818" class="body">Partial or missing callbacks end the job.</text>

    <rect x="1192" y="690" width="336" height="142" rx="10" class="card"/>
    <text x="1220" y="728" class="eyebrow" fill="#2C7377">RETENTION</text>
    <text x="1220" y="766" class="title">Forget the body.</text>
    <text x="1220" y="796" class="body">Terminal work purges message and sender</text>
    <text x="1220" y="818" class="body">ciphertext; bounded metadata remains.</text>
  </g>

  <!-- Bottom invariant -->
  <g class="sans">
    <path d="M72 888H1528" stroke="#D4DCE2"/>
    <circle cx="84" cy="930" r="5" fill="#2C7377"/>
    <text x="104" y="936" class="body">No silent SIM remapping. No default route. No sensitive body retained after completion.</text>
    <text x="1528" y="936" text-anchor="end" class="mono muted">SEE SPEC.MD FOR THE FULL POLICY</text>
  </g>
</svg>
