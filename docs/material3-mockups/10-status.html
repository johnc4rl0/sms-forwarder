<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>M3 Mock — Status</title>
  <link rel="stylesheet" href="m3.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="solo-page">
  <div>
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span class="status-icons">▮▮▮ · 5G · ⚡</span></div>
      <div class="app-body">
        <div class="top-app-bar">
          <div class="title">Status</div>
        </div>
        <div class="scroll">
          <div style="margin-bottom:16px"><span class="badge ok">● Enabled</span></div>
          <div class="card elevated">
            <div class="card-title">Forwarding summary</div>
            <div class="stat-row"><span class="k">Source</span><span>+…4567</span></div>
            <div class="stat-row"><span class="k">Outbound</span><span>+…1140</span></div>
            <div class="stat-row"><span class="k">Destination</span><span>+…4548</span></div>
            <p class="body" style="margin:12px 0 0">Edit setup in <strong>Settings</strong>.</p>
          </div>
          <div class="card">
            <div class="card-title">Health</div>
            <div class="stat-row"><span class="k">Permissions</span><span class="badge ok">OK</span></div>
            <div class="stat-row"><span class="k">Subscriptions</span><span class="badge ok">OK</span></div>
            <div class="stat-row"><span class="k">Notifications</span><span class="badge ok">OK</span></div>
            <div class="stat-row"><span class="k">Hibernation</span><span class="badge">Check</span></div>
          </div>
          <div class="card filled">
            <div class="card-title">Rolling 24h quota</div>
            <div class="stat-row"><span class="k">Source messages</span><span>2 / 100</span></div>
            <div class="stat-row"><span class="k">Outbound segments</span><span>2 / 500</span></div>
            <div class="linear-progress" style="margin:12px 0 0"><i style="width:2%"></i></div>
          </div>
          <div class="btn-row">
            <button class="btn filled" type="button">Pause forwarding</button>
          </div>
        </div>
        <div data-nav="status"></div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <div class="frame-label">10 · Status tab · Nav bar</div>
  </div>
  <script src="partials-nav.js"></script>
</body>
</html>
