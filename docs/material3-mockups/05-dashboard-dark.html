<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>M3 Mock — Dashboard Dark</title>
  <link rel="stylesheet" href="m3.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="solo-page" style="background:#0e0e13">
  <div>
    <div class="phone dark">
      <div class="status-bar"><span>9:41</span><span class="status-icons">▮▮▮ · 5G · ⚡</span></div>
      <div class="app-body">
        <div class="top-app-bar">
          <div class="title">SMS Forwarder</div>
          <div class="icon-btn">⋮</div>
        </div>
        <div class="scroll">
          <div style="margin-bottom:16px"><span class="badge ok">● Enabled</span></div>
          <div class="card elevated">
            <div class="card-title">Configuration</div>
            <div class="stat-row"><span class="k">Source</span><span>+…4567</span></div>
            <div class="stat-row"><span class="k">Outbound</span><span>+…1140</span></div>
            <div class="stat-row"><span class="k">Destination</span><span>+…4548</span></div>
          </div>
          <div class="card filled">
            <div class="card-title">Rolling 24h quota</div>
            <div class="stat-row"><span class="k">Source messages</span><span>2 / 100</span></div>
            <div class="stat-row"><span class="k">Outbound segments</span><span>2 / 500</span></div>
          </div>
          <div class="card">
            <div class="card-title">Recent outcomes</div>
            <div class="list-item"><strong>SENT</strong><div class="meta">Today 10:47</div></div>
            <div class="list-item"><strong>SENT</strong><div class="meta">Today 10:49</div></div>
          </div>
          <div class="btn-row">
            <button class="btn filled" type="button">Pause forwarding</button>
            <button class="btn outlined" type="button">Re-enable…</button>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <div class="frame-label" style="color:#c7c5d0">05 · Dashboard · Dark</div>
  </div>
</body>
</html>
