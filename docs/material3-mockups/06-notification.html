<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>M3 Mock — Status notification</title>
  <link rel="stylesheet" href="m3.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="solo-page" style="background:#121218">
  <div>
    <div class="phone dark">
      <div class="status-bar"><span>9:41</span><span class="status-icons">▮▮▮ · 5G · ⚡</span></div>
      <div class="app-body">
        <div class="notif-shade">
          <div style="color:#aaa;font-size:0.75rem;margin:8px 4px 12px">Notification shade · low importance ongoing</div>
          <div class="notif-card">
            <div class="notif-app">
              <span>SMS Forwarder</span>
              <span>now</span>
            </div>
            <div class="notif-title">SMS forwarding active</div>
            <div class="notif-body">Source +…4567 · Out +…1140 · To +…4548</div>
            <div class="notif-actions">
              <span>Pause</span>
            </div>
          </div>
          <p style="color:#888;font-size:0.75rem;margin:20px 4px;line-height:1.4">
            Material 3 notification styling: compact ongoing card, single action, masked numbers, no message bodies.
          </p>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <div class="frame-label" style="color:#c7c5d0">06 · Ongoing notification · Dark shade</div>
  </div>
</body>
</html>
